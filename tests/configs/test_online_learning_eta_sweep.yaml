###############################################################################
# Minimal config for testing online learning eta sweep (2 values)
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 1
  test_validation_train_split: [0.2, 0.2, 0.6]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "SubspaceNet"
  params:
    diff_method: "esprit"
    train_loss_type: "rmspe"
    tau: 8
    field_type: "Far"
    regularization: "null"
    variant: "small"
    norm_layer: false
    batch_norm: false

training:
  enabled: false
  epochs: 1
  batch_size: 2
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "test_eta_sweep"
  save_checkpoint: false

simulation:
  train_model: false
  evaluate_model: false
  load_model: true
  save_model: false
  plot_results: false
  save_plots: false
  model_path: null
  subspace_methods: []

scenario_config:
  type: "eta"
  values: [0.5, 1.0]
  model_paths: ["experiments/results/base_model_random_data_snr_10_SubspaceNet_esprit_N9_M3_SNR10.0_Far_ESPRIT/checkpoints/final_SubspaceNet_20250916_084930.pt"]
  retrain_model: false

trajectory:
  enabled: true
  trajectory_type: "sine_accel_nonlinear"
  sine_accel_omega0: [-0.15, 0.25, 0.15]
  sine_accel_kappa: [3, -3, 2]
  sine_accel_noise_std: 0.03
  trajectory_length: 15
  save_trajectory: false

kalman_filter:
  process_noise_std_dev: 0.05
  measurement_noise_std_dev: 0.05
  initial_covariance: 0.001

online_learning:
  enabled: true
  window_size: 3
  stride: 2
  loss_threshold: 0.2
  max_iterations: 2
  learning_rate: 0.001
  trajectory_length: 15
  dataset_size: 1
  use_adaptive_learning_rate: true
  glrt_detection_z_threshold: 2.5
  glrt_baseline_window_size: 5
  glrt_min_samples_for_statistics: 3
  adaptive_lr_min: 0.0005
  adaptive_lr_max: 0.0356
  adaptive_lr_k_sigmoid: 0.7336
  adaptive_lr_dG0: 69.2599
  glrt_history_exclusion: 2
  num_gd_steps: 1
  enable_lr_sweep: false
  eta_update_interval_windows: 3
  use_nominal: true
  loss_config:
    metric: "rmspe"
    supervision: "supervised"
    training_loss_type: "unsupervised_rmspe"
    supervised_loss_type: "supervised_rmspe"
  time_to_learn: 2

logging:
  level: "WARNING"
  subspace_net_level: "WARNING"
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
