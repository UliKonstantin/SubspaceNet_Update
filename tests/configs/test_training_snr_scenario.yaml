###############################################################################
# Minimal config for testing training with SNR scenario sweep (2 values)
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 2
  test_validation_train_split: [0.2, 0.2, 0.6]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "SubspaceNet"
  params:
    diff_method: "esprit"
    train_loss_type: "rmspe"
    tau: 8
    field_type: "Far"
    regularization: "null"
    variant: "small"
    norm_layer: false
    batch_norm: false

training:
  enabled: true
  epochs: 1
  batch_size: 2
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "test_snr_scenario"
  save_checkpoint: false

simulation:
  train_model: true
  evaluate_model: false
  load_model: false
  save_model: false
  plot_results: false
  save_plots: false
  model_path: null
  subspace_methods: []

scenario_config:
  type: "snr"
  values: [5, 10]
  retrain_model: true

trajectory:
  enabled: true
  trajectory_type: "random"
  trajectory_length: 10
  save_trajectory: false

kalman_filter:
  process_noise_std_dev: 0.05
  measurement_noise_std_dev: 0.05
  initial_covariance: 0.001

logging:
  level: "WARNING"
  subspace_net_level: "WARNING"
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
