###############################################################################
# DeepCNN RMSPE evaluation (pre-EKF angles vs GT), degree-scale reporting.
# Use with: main_v2.py run --goal evaluate --trajectory -m CKPT -o OUT
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 1
  test_validation_train_split: [1.0, 0.0, 0.0]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "DeepCNN"
  params:
    grid_size: 121
    peak_method: "peaks"

training:
  enabled: false
  batch_size: 1
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "paper_deepcnn_rmspe_eval"
  save_checkpoint: false

simulation:
  train_model: false
  evaluate_model: true
  load_model: true
  save_model: false
  plot_results: true
  save_plots: true
  seed: 42
  model_path: "experiments/results/basemodels_for_journal_paper/deepcnn/snr_10.0/checkpoints/final_DeepCNN_20260820_173256.pt"
  subspace_methods: []
  simulation_name: "paper_deepcnn_rmspe_eval"

evaluation:
  save_results: true
  results_format: "json"
  detailed_metrics: true
  kalman_filter: true

trajectory:
  enabled: true
  trajectory_type: "sine_accel_nonlinear"
  trajectory_length: 200
  sine_accel_omega0: [-0.15, 0.25, 0.15]
  sine_accel_kappa: [3, -3, 2]
  sine_accel_noise_std: 0.06
  sine_accel_dc_offset_range: [-15, 15]
  save_trajectory: false

kalman_filter:
  filter_type: "extended"
  process_noise_std_dev: 0.06
  measurement_noise_std_dev: 0.03
  initial_covariance: 0.001

online_learning:
  enabled: false

logging:
  level: "INFO"
  subspace_net_level: null
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
  log_file_path: null
  log_file_level: "DEBUG"
