###############################################################################
# PF-09 — DeepCNN OL smoke with trained checkpoint (after paper_deepcnn_training_smoke.yaml)
# Usage:
#   python3 main_v2.py run -c configs/Used_for_paper/paper_deepcnn_smoke.yaml \
#     --goal online_learning --trajectory \
#     -o experiments/results/smoke_runs/journal_paper/PF-09
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 1
  test_validation_train_split: [0.2, 0.2, 0.6]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "DeepCNN"
  params:
    grid_size: 121
    peak_method: "peaks"

training:
  enabled: false
  epochs: 1
  batch_size: 32
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "paper_deepcnn_smoke"
  save_checkpoint: false

simulation:
  train_model: false
  evaluate_model: false
  load_model: true
  save_model: false
  plot_results: true
  save_plots: true
  model_path: "experiments/results/basemodels_for_journal_paper/deepcnn/snr_10.0/checkpoints/final_DeepCNN_20260820_173256.pt"
  subspace_methods: []
  simulation_name: "paper_deepcnn_smoke"
  output_dir: "experiments/results/smoke_runs/journal_paper"

trajectory:
  enabled: true
  trajectory_type: "sine_accel_nonlinear"
  sine_accel_omega0: [-0.15, 0.25, 0.15]
  sine_accel_kappa: [3, -3, 2]
  sine_accel_noise_std: 0.06
  sine_accel_dc_offset_range: [-15, 15]
  save_trajectory: false

kalman_filter:
  filter_type: "extended"
  process_noise_std_dev: 0.06
  measurement_noise_std_dev: 0.03
  initial_covariance: 0.001

online_learning:
  enabled: true
  window_size: 5
  stride: 3
  loss_threshold: 0.2
  max_iterations: 2
  learning_rate: 0.001
  trajectory_length: 80
  dataset_size: 1
  use_adaptive_learning_rate: true
  drift_warmup_windows: 10
  drift_guard_samples: 3
  drift_z_threshold: 2.5
  adaptation_window_count: 5
  adaptive_lr_min: 0.0005
  adaptive_lr_max: 0.02
  adaptive_lr_k_sigmoid: 0.7336
  adaptive_lr_dG0: 14.5
  num_gd_steps: 3
  enable_lr_sweep: false
  eta_update_interval_windows: 32
  eta_increment: 0.5
  max_eta: 1.5
  min_eta: 0.0
  use_nominal: true
  loss_config:
    adaptation_loss: "unsupervised_rmspe"
    reference_metric: "supervised_rmspe"
    supervised_offline_loss: "supervised_rmspe"
  time_to_learn: 2

logging:
  level: "INFO"
  subspace_net_level: null
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
  log_file_path: null
  log_file_level: "DEBUG"
