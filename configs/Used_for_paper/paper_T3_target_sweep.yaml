###############################################################################
# PF-22 / PF-05 — T3 target-count sweep (N=9, snr=10 fixed)
# sine_accel_* broadcast to M at runtime (simulation/runners/data.py)
# Thin:  --sweep 1d --axis m -v 3  → smoke_runs/journal_paper/T3
# Full:  -v 2 -v 3 -v 4 -v 5       → journal_paper/paper_T3_targets
# M=2,4,5 checkpoints: train via PF-07 (paths below are placeholders until then)
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 1
  test_validation_train_split: [0.2, 0.2, 0.6]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "SubspaceNet"
  params:
    diff_method: "esprit"
    train_loss_type: "rmspe"
    tau: 8
    field_type: "Far"
    regularization: "null"
    variant: "small"
    norm_layer: false
    batch_norm: false

training:
  enabled: false
  epochs: 3
  batch_size: 256
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "paper_T3_targets"
  save_checkpoint: true

simulation:
  train_model: false
  evaluate_model: false
  load_model: true
  save_model: true
  plot_results: true
  save_plots: true
  model_path: null
  subspace_methods: []
  simulation_name: "paper_T3_targets"
  output_dir: "experiments/results/journal_paper/paper_T3_targets"

trajectory:
  enabled: true
  trajectory_type: "sine_accel_nonlinear"
  sine_accel_omega0: [-0.15, 0.25, 0.15]
  sine_accel_kappa: [3, -3, 2]
  sine_accel_noise_std: 0.06
  sine_accel_dc_offset_range: [-15, 15]
  save_trajectory: false

kalman_filter:
  filter_type: "extended"
  process_noise_std_dev: 0.06
  measurement_noise_std_dev: 0.03
  initial_covariance: 0.001

scenario_config:
  type: "m"
  values: [2, 3, 4, 5]
  model_paths:
    - "experiments/results/basemodels_for_journal_paper/subspacenet/N9_M2_SNR10.0/checkpoints/final_SubspaceNet_20260818_191718.pt"
    - "experiments/results/basemodels_for_journal_paper/subspacenet/snr_10.0/checkpoints/final_SubspaceNet_20250916_084930.pt"
    - "experiments/results/basemodels_for_journal_paper/subspacenet/N9_M4_SNR10.0/checkpoints/final_SubspaceNet_20260818_193322.pt"
    - "experiments/results/basemodels_for_journal_paper/subspacenet/N9_M5_SNR10.0/checkpoints/final_SubspaceNet_20260818_194809.pt"
  retrain_model: false

online_learning:
  enabled: true
  window_size: 5
  stride: 3
  loss_threshold: 0.2
  max_iterations: 2
  learning_rate: 0.001
  trajectory_length: 200
  dataset_size: 1
  use_adaptive_learning_rate: true
  drift_warmup_windows: 10
  drift_guard_samples: 3
  drift_z_threshold: 2.5
  adaptation_window_count: 5
  adaptive_lr_min: 0.0005
  adaptive_lr_max: 0.02
  adaptive_lr_k_sigmoid: 0.7336
  adaptive_lr_dG0: 14.5
  num_gd_steps: 3
  enable_lr_sweep: false
  eta_update_interval_windows: 32
  eta_increment: 0.5
  max_eta: 1.5
  min_eta: 0.0
  use_nominal: true
  loss_config:
    adaptation_loss: "unsupervised_rmspe"
    reference_metric: "supervised_rmspe"
    supervised_offline_loss: "supervised_rmspe"
  time_to_learn: 2

logging:
  level: "INFO"
  subspace_net_level: null
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
  log_file_path: null
  log_file_level: "DEBUG"
