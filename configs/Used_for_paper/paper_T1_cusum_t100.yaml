###############################################################################
# T=100 protocol copied from paper_T1_cusum.yaml. drift_detector=loss_cusum.
# 96 windows (indices 0..95). Does not write the locked T=200 outdir.
# Full: -O online_learning.dataset_size=50 -o experiments/results/journal_paper/paper_T1_cusum_t100_ds50
###############################################################################
###############################################################################
# T1 CUSUM probe — same N/η/ckpt lock as paper_T1_antenna_sweep.yaml
# Trigger: drift_detector=loss_cusum (not glrt_z). Do not overwrite paper_T1_antenna_ds50.
# Full: dataset_size=50, N ∈ {6, 9, 12}
###############################################################################
system_model:
  N: 9
  M: 3
  T: 200
  snr: 10
  field_type: "far"
  signal_nature: "non-coherent"
  signal_type: "narrowband"
  wavelength: 0.06
  eta: 0.0
  bias: 0
  sv_noise_var: 0.0
  doa_range: 60
  doa_resolution: 1
  max_range_ratio_to_limit: 0.5
  range_resolution: 1

dataset:
  samples_size: 1
  test_validation_train_split: [0.2, 0.2, 0.6]
  create_data: true
  save_dataset: false
  true_doa_train: null
  true_range_train: null
  true_doa_test: null
  true_range_test: null

model:
  type: "SubspaceNet"
  params:
    diff_method: "esprit"
    train_loss_type: "rmspe"
    tau: 8
    field_type: "Far"
    regularization: "null"
    variant: "small"
    norm_layer: false
    batch_norm: false

training:
  enabled: false
  epochs: 3
  batch_size: 256
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  learning_rate: 0.001
  weight_decay: 1e-9
  step_size: 50
  gamma: 0.5
  training_objective: "angle"
  use_wandb: false
  simulation_name: "paper_T1_cusum_t100"
  save_checkpoint: true

simulation:
  train_model: false
  evaluate_model: false
  load_model: true
  save_model: true
  plot_results: true
  save_plots: true
  model_path: null
  subspace_methods: []
  simulation_name: "paper_T1_cusum_t100"
  output_dir: "experiments/results/journal_paper/paper_T1_cusum_t100"
  seed: 42

trajectory:
  enabled: true
  trajectory_type: "sine_accel_nonlinear"
  sine_accel_omega0: [-0.15, 0.25, 0.15]
  sine_accel_kappa: [3, -3, 2]
  sine_accel_noise_std: 0.06
  sine_accel_dc_offset_range: [-15, 15]
  save_trajectory: false

kalman_filter:
  filter_type: "extended"
  process_noise_std_dev: 0.06
  measurement_noise_std_dev: 0.30
  initial_covariance: 0.001

scenario_config:
  type: "n"
  values: [6, 9, 12]
  eta_increments: [2.40, 1.30, 6.00]
  max_etas: [2.40, 1.30, 6.00]
  model_paths:
    - "experiments/results/basemodels_for_journal_paper/subspacenet/N6_M3_SNR10.0/checkpoints/final_SubspaceNet_20260818_173845.pt"
    - "experiments/results/basemodels_for_journal_paper/subspacenet/snr_10.0/checkpoints/final_SubspaceNet_20250916_084930.pt"
    - "experiments/results/basemodels_for_journal_paper/subspacenet/N12_M3_SNR10.0/checkpoints/final_SubspaceNet_20260909_101914.pt"
  retrain_model: false

online_learning:
  enabled: true
  window_size: 5
  stride: 1
  loss_threshold: 0.2
  max_iterations: 2
  learning_rate: 0.001
  trajectory_length: 100
  dataset_size: 1
  use_adaptive_learning_rate: true
  drift_type: position_eta
  drift_profile: step
  drift_detector: loss_cusum
  drift_warmup_windows: 18
  drift_guard_samples: 3
  drift_z_threshold: 2.5
  drift_recent_tau_k: 12
  cusum_ekf_settle_windows: 3
  cusum_hump_confirm_windows: 5
  cusum_ref_windows: 8
  cusum_kappa: 0.5
  cusum_h: 5.0
  cusum_loss_threshold: 0.05
  cusum_settle_fallback_window: 24
  adaptation_window_count: 5
  adaptive_lr_min: 0.0005
  adaptive_lr_max: 0.02
  adaptive_lr_k_sigmoid: 0.7336
  adaptive_lr_dG0: 7.5
  num_gd_steps: 3
  enable_lr_sweep: false
  eta_update_interval_windows: 40
  eta_increment: 1.30
  max_eta: 1.30
  min_eta: 0.0
  use_nominal: true
  loss_config:
    adaptation_loss: "unsupervised_rmspe"
    reference_metric: "supervised_rmspe"
    supervised_offline_loss: "supervised_rmspe"
  time_to_learn: 2

logging:
  level: "INFO"
  subspace_net_level: null
  kalman_filter_level: "WARNING"
  torch_level: "WARNING"
  matplotlib_level: "WARNING"
  log_to_file: false
  log_file_path: null
  log_file_level: "DEBUG"
